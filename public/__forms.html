<!--
  Netlify form detection file.

  Next.js static export does NOT emit the plain HTML <form> that Netlify's build bot
  scans for, so we declare the forms here. Netlify reads this at deploy time and
  registers the forms; the React components (ContactForm/QuoteForm) then POST to "/"
  with a matching `form-name`. Keep field names in sync with the components.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <!-- Contact form (fields must match ContactSection.tsx) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <textarea name="details"></textarea>
    </form>

    <!-- Quote request form -->
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <input type="text" name="location" />
      <input type="text" name="budget" />
      <textarea name="details"></textarea>
    </form>
  </body>
</html>
